<!-- Giriş / Kayıt Modal Penceresi -->
<div id="auth-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
  <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 max-w-sm w-full relative shadow-2xl">
    <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">&times;</button>
    <h3 class="text-lg font-bold text-white mb-2 font-mono text-cyan-400">CyberYigit Portal</h3>
    <p class="text-xs text-slate-400 mb-4">Özel lab notları ve dokümanlara erişmek için giriş yapın.</p>
    
    <div id="auth-status"></div>

    <form onsubmit="event.preventDefault();" class="space-y-3">
      <div>
        <label class="block text-xs font-mono text-slate-400 mb-1">E-POSTA</label>
        <input type="email" id="auth-email" required class="w-full px-3 py-2 rounded bg-slate-950 border border-slate-800 text-white text-sm focus:outline-none focus:border-cyan-500">
      </div>
      <div>
        <label class="block text-xs font-mono text-slate-400 mb-1">PAROLA</label>
        <input type="password" id="auth-password" required class="w-full px-3 py-2 rounded bg-slate-950 border border-slate-800 text-white text-sm focus:outline-none focus:border-cyan-500">
      </div>
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="handleLogin(document.getElementById('auth-email').value, document.getElementById('auth-password').value)" class="flex-1 py-2 rounded bg-cyan-500 text-black text-xs font-semibold hover:bg-cyan-400 transition">Giriş Yap</button>
        <button type="button" onclick="handleRegister(document.getElementById('auth-email').value, document.getElementById('auth-password').value)" class="flex-1 py-2 rounded border border-slate-700 bg-slate-800 text-slate-300 text-xs font-semibold hover:border-slate-500 transition">Kayıt Ol</button>
      </div>
    </form>
  </div>
</div>
