<div id="auth-modal" style="display:none; position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; padding:1rem;">
  <div style="background:#0f172a; border:1px solid #1e293b; border-radius:12px; padding:24px; max-width:380px; width:100%; position:relative; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">
    <button onclick="closeAuthModal()" style="position:absolute; top:12px; right:16px; color:#94a3b8; font-size:20px; background:none; border:none; cursor:pointer;">&times;</button>
    <h3 style="color:#22d3ee; font-family:monospace; font-size:18px; font-weight:bold; margin-bottom:6px;">CyberYigit Portal</h3>
    <p style="color:#94a3b8; font-size:12px; margin-bottom:16px;">Özel laboratuvar notlarına erişmek için giriş yapın.</p>
    
    <div id="auth-status" style="font-size:12px; font-family:monospace; margin-bottom:10px;"></div>

    <form onsubmit="event.preventDefault();" style="display:flex; flex-direction:column; gap:12px;">
      <div>
        <label style="display:block; font-size:11px; font-family:monospace; color:#94a3b8; margin-bottom:4px;">E-POSTA</label>
        <input type="email" id="auth-email" required style="width:100%; padding:8px 12px; background:#020617; border:1px solid #334155; border-radius:6px; color:#fff; font-size:14px; box-sizing:border-box;">
      </div>
      <div>
        <label style="display:block; font-size:11px; font-family:monospace; color:#94a3b8; margin-bottom:4px;">PAROLA</label>
        <input type="password" id="auth-password" required style="width:100%; padding:8px 12px; background:#020617; border:1px solid #334155; border-radius:6px; color:#fff; font-size:14px; box-sizing:border-box;">
      </div>
      <div style="display:flex; gap:8px; margin-top:6px;">
        <button type="button" onclick="handleLogin(document.getElementById('auth-email').value, document.getElementById('auth-password').value)" style="flex:1; padding:10px; background:#22d3ee; color:#000; font-weight:bold; font-size:12px; border:none; border-radius:6px; cursor:pointer;">Giriş Yap</button>
        <button type="button" onclick="handleRegister(document.getElementById('auth-email').value, document.getElementById('auth-password').value)" style="flex:1; padding:10px; background:#1e293b; color:#cbd5e1; font-weight:bold; font-size:12px; border:1px solid #475569; border-radius:6px; cursor:pointer;">Kayıt Ol</button>
      </div>
    </form>
  </div>
</div>
