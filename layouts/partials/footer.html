{{- if not (.Param "hideFooter") }}
<footer class="footer">
    {{- if site.Copyright }}
    <span>{{ site.Copyright | markdownify }}</span>
    {{- else }}
    <span>&copy; {{ now.Year }} <a href="{{ "" | absLangURL }}">{{ site.Title }}</a></span>
    {{- end }}
    <span>
        Powered by
        <a href="https://gohugo.io/" rel="noopener noreferrer" target="_blank">Hugo</a> &
        <a href="https://github.com/adityatelange/hugo-PaperMod/" rel="noopener" target="_blank">PaperMod</a>
    </span>
</footer>
{{- end }}

<!-- CyberYigit Auth Modal -->
<div id="auth-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:9999999; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; backdrop-filter:blur(4px);">
  <div style="background:#0f172a; border:1px solid #334155; border-radius:12px; padding:28px; max-width:380px; width:90%; position:relative; box-shadow:0 25px 50px -12px rgba(0, 0, 0, 0.7); box-sizing:border-box;">
    <button type="button" onclick="closeAuthModal()" style="position:absolute; top:12px; right:16px; color:#94a3b8; font-size:24px; background:none; border:none; cursor:pointer; line-height:1;">&times;</button>
    <h3 style="color:#22d3ee; font-family:monospace; font-size:18px; font-weight:bold; margin-top:0; margin-bottom:6px;">CyberYigit Portal</h3>
    <p style="color:#94a3b8; font-size:12px; margin-bottom:16px;">Özel laboratuvar notlarına erişmek için oturum açın / Sign in to access private notes.</p>
    
    <div id="auth-status" style="font-size:12px; font-family:monospace; margin-bottom:12px; min-height:16px;"></div>

    <form onsubmit="event.preventDefault();" style="display:flex; flex-direction:column; gap:12px;">
      <div>
        <label style="display:block; font-size:11px; font-family:monospace; color:#94a3b8; margin-bottom:4px;">E-POSTA / EMAIL</label>
        <input type="email" id="auth-email" required style="width:100%; padding:10px 12px; background:#020617; border:1px solid #334155; border-radius:6px; color:#fff; font-size:14px; box-sizing:border-box;">
      </div>
      <div>
        <label style="display:block; font-size:11px; font-family:monospace; color:#94a3b8; margin-bottom:4px;">PAROLA / PASSWORD</label>
        <input type="password" id="auth-password" required style="width:100%; padding:10px 12px; background:#020617; border:1px solid #334155; border-radius:6px; color:#fff; font-size:14px; box-sizing:border-box;">
      </div>
      <div style="display:flex; gap:10px; margin-top:6px;">
        <button type="button" onclick="doLogin()" style="flex:1; padding:10px; background:#22d3ee; color:#020617; font-weight:bold; font-size:13px; border:none; border-radius:6px; cursor:pointer;">Giriş Yap</button>
        <button type="button" onclick="doRegister()" style="flex:1; padding:10px; background:#1e293b; color:#cbd5e1; font-weight:bold; font-size:13px; border:1px solid #475569; border-radius:6px; cursor:pointer;">Kayıt Ol</button>
      </div>
    </form>
  </div>
</div>
