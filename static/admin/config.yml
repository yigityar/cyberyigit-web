backend:
  name: github
  repo: yigityar/cyberyigit-web
  branch: main

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "posts_tr"
    label: "Türkçe Yazılar"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    filter: {field: "draft", value: false}
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Tarih", name: "date", widget: "datetime"}
      - {label: "Taslak mı?", name: "draft", widget: "boolean", default: false}
      - {label: "Kategoriler", name: "categories", widget: "list"}
      - {label: "Etiketler", name: "tags", widget: "list"}
      - {label: "İçerik", name: "body", widget: "markdown"}

  - name: "posts_en"
    label: "İngilizce Yazılar"
    folder: "content/posts"
    create: true
    slug: "{{slug}}.en"
    filter: {field: "draft", value: false}
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - {label: "Categories", name: "categories", widget: "list"}
      - {label: "Tags", name: "tags", widget: "list"}
      - {label: "Content", name: "body", widget: "markdown"}
